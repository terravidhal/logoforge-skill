name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/package-lock.json

      - name: Check skill, links, JSON, assets
        run: npm run lint

      - name: Install the example
        run: npm --prefix examples ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build the example
        run: npm --prefix examples run build
